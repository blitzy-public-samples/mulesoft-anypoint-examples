# HTTP listener port (D-065)
http:
  port: 8081
# Bind address of the HTTP_Listener_Configuration listener
listener:
  http-listener-configuration:
    host: 0.0.0.0
server:
  port: ${http.port}
  address: ${listener.http-listener-configuration.host}
spring:
  application:
    name: track-a-custom-business-event-java
  mvc:
    dispatch-trace-request: true  # TRACE requests reach the handler mappings (D-629)
  web:
    resources:
      add-mappings: false
