http:
  port: 8081
listener:
  # HTTP_Listener_Configuration bind address; its listener path / is the literal mapping of CalculatorController (D-175)
  http-listener-configuration:
    host: 0.0.0.0
server:
  port: ${http.port}
  address: ${listener.http-listener-configuration.host}
spring:
  application:
    name: addition-using-javascript-transformer-java
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
