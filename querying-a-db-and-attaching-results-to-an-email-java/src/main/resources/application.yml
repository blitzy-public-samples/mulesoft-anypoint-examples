    name: querying-a-db-and-attaching-results-to-an-email-java
  sql:
    init:
      mode: never
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-trace-request: true
  web:
    resources:
      add-mappings: false

http:
  port: 8081

listener:
