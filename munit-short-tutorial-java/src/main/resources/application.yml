http:
  port: 8081                       # listener port of exampleFlow (D-065)
listener:
  http-listener-configuration:
    host: 0.0.0.0
server:
  port: ${http.port}
  address: ${listener.http-listener-configuration.host}
spring:
  application:
    name: munit-short-tutorial-java
  mvc:
    throw-exception-if-no-handler-found: true
    dispatch-trace-request: true   # TRACE requests reach the handler mappings (D-455)
  web:
    resources:
      add-mappings: false
