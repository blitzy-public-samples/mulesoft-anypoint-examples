server:
  port: ${listener.http-listener-configuration-1.port}
  address: ${listener.http-listener-configuration-1.host}
spring:
  web:
    resources:
      add-mappings: false
listener:
  http-listener-configuration-1:
    host: 0.0.0.0
    port: 11081
    base-path: ""
  http-listener-configuration-2:
    host: 0.0.0.0
    port: 18080
    base-path: /mule/TheCreditAgencyService
  http-listener-configuration-3:
    host: 0.0.0.0
    port: 10080
    base-path: /mule/TheBank1
  http-listener-configuration-4:
    host: 0.0.0.0
    port: 20080
    base-path: /mule/TheBank2
  http-listener-configuration-5:
    host: 0.0.0.0
    port: 30080
    base-path: /mule/TheBank3
  http-listener-configuration-6:
    host: 0.0.0.0
    port: 40080
    base-path: /mule/TheBank4
  http-listener-configuration-7:
    host: 0.0.0.0
    port: 50080
    base-path: /mule/TheBank5
request:
  http-request-configuration-1:
    host: 0.0.0.0
    port: 18080
    base-path: /mule/TheCreditAgencyService
    path: "/*"
    response-timeout: 10000
  http-request-configuration-2:
    path: "/*"
    response-timeout: 10000
lookup-banks:
  bank-1-uri: http://0.0.0.0:10080/mule/TheBank1
  bank-2-uri: http://0.0.0.0:20080/mule/TheBank2
  bank-3-uri: http://0.0.0.0:30080/mule/TheBank3
  bank-4-uri: http://0.0.0.0:40080/mule/TheBank4
  bank-5-uri: http://0.0.0.0:50080/mule/TheBank5
bank1-flow:
  bank-name: "Bank #1"
bank2-flow:
  bank-name: "Bank #2"
bank3-flow:
  bank-name: "Bank #3"
bank4-flow:
  bank-name: "Bank #4"
bank5-flow:
  bank-name: "Bank #5"
