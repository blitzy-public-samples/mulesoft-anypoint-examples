<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Console</title>
<!-- Page layout and control states: fonts, margins, response wrapping, button spacing, focus, hover, active, disabled, loading and error (D-141) -->
<style>
  :root {
    --console-space: 0.5rem;
    --console-focus-color: #0b57d0;
    --console-error-color: #b3261e;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin-block: 1rem;
    margin-inline: 2rem;
    font-family: system-ui, sans-serif;
    line-height: 1.4;
  }
  h3 {
    margin-block: 1rem var(--console-space);
    font-size: 1rem;
  }
  button {
    margin-block: 0 var(--console-space);
    margin-inline: 0 var(--console-space);
    font: inherit;
  }
  textarea {
    display: block;
    max-inline-size: 100%;
    margin-block: var(--console-space);
  }
  pre {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
  a:hover {
    text-decoration-thickness: 0.125em;
  }
  a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--console-focus-color);
    outline-offset: 2px;
  }
  button:where(:enabled) {
    cursor: pointer;
  }
  button:enabled:hover {
    filter: brightness(0.95);
  }
  button:enabled:active {
    filter: brightness(0.85);
  }
  button:disabled, input:disabled, textarea:disabled {
    cursor: not-allowed;
    opacity: 0.6;
  }
  [aria-busy=true], [aria-busy=true] * {
    cursor: progress;
  }
  [aria-busy=true] {
    opacity: 0.6;
  }
  [aria-invalid=true] {
    outline: 2px solid var(--console-error-color);
  }
  [aria-invalid=true]:focus-visible {
    box-shadow: 0 0 0 2px var(--console-error-color);
  }
</style>
</head>
<body>
  <!-- API console page (D-009) -->
  <!-- API title, written from the console model -->
  <h1 id="api-title"></h1>
  <!-- Link to the served RAML contract -->
  <p><a href="api.raml">api.raml</a></p>
  <!-- Resource list: one heading per resource and one button per method -->
  <div id="resources"></div>
  <!-- Details panel: request format and expected responses of the selected method (D-009) -->
  <div id="details" style="display:none"></div>
  <!-- Try It panel (D-009) -->
  <div id="try-it" style="display:none">
    <h2>Try It</h2>
    <!-- URI and query parameter inputs of the selected method -->
    <div class="try-it-params"></div>
    <!-- Request body input of Try It (D-009) -->
    <textarea id="try-it-request-body" rows="6" cols="60" aria-label="Request body"></textarea>
    <!-- Send button, labelled with the selected method -->
    <button type="button" id="try-it-send"></button>
    <h3>Status</h3>
    <div id="try-it-status" aria-live="polite"></div>
    <h3>Headers</h3>
    <pre id="try-it-headers" aria-live="polite"></pre>
    <h3>Body</h3>
    <!-- Response body output of Try It (D-009) -->
    <pre id="try-it-body" aria-live="polite"></pre>
  </div>
  <script src="console.js"></script>
</body>
</html>
