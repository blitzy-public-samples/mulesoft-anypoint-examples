<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Console</title>
<!-- Page layout: fonts, margins, response wrapping, button spacing -->
<style>
  :root {
    --console-space: 0.5rem;
  }
  *, *::before, *::after {
    box-sizing: border-box;
  }
  body {
    margin-block: 1rem;
    margin-inline: 2rem;
    font-family: system-ui, sans-serif;
    line-height: 1.4;
  }
  h3 {
    margin-block: 1rem var(--console-space);
    font-size: 1rem;
  }
  button {
    margin-block: 0 var(--console-space);
    margin-inline: 0 var(--console-space);
    font: inherit;
  }
  textarea {
    display: block;
    max-inline-size: 100%;
    margin-block: var(--console-space);
  }
  pre {
    margin: 0;
    white-space: pre-wrap;
    overflow-wrap: break-word;
  }
</style>
</head>
<body>
  <!-- API console page (D-009) -->
  <!-- API title, written from the console model -->
  <h1 id="api-title"></h1>
  <!-- Link to the served RAML contract -->
  <p><a href="api.raml">api.raml</a></p>
  <!-- Resource list: one heading per resource and one button per method -->
  <div id="resources"></div>
  <!-- Details panel: request format and expected responses of the selected method (D-009) -->
  <div id="details" style="display:none"></div>
  <!-- Try It panel (D-009) -->
  <div id="try-it" style="display:none">
    <h2>Try It</h2>
    <!-- URI and query parameter inputs of the selected method -->
    <div class="try-it-params"></div>
    <!-- Request body input of Try It (D-009) -->
    <textarea id="try-it-request-body" rows="6" cols="60" aria-label="Request body"></textarea>
    <!-- Send button, labelled with the selected method -->
    <button type="button" id="try-it-send"></button>
    <h3>Status</h3>
    <div id="try-it-status" aria-live="polite"></div>
    <h3>Headers</h3>
    <pre id="try-it-headers"></pre>
    <h3>Body</h3>
    <!-- Response body output of Try It (D-009) -->
    <pre id="try-it-body"></pre>
  </div>
  <script src="console.js"></script>
</body>
</html>
