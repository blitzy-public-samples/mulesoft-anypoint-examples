# Test profile: values for in-JVM test actors only (D-012). The embedded Artemis broker,
# its queues and the active-mq.* keys come from application.yml (D-080).
jdbc:
  # In-memory H2 database in MySQL mode, open for the life of the test JVM (D-039, D-491)
  url: jdbc:h2:mem:company;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring:
  sql:
    init:
      # Runs order.sql against the jdbc.url database when the context starts (D-491)
      mode: always
      schema-locations: classpath:order.sql
