http:
  port: 8081  # Listener port of flow main (D-065)
listener:
  http-listener-configuration:
    host: 0.0.0.0
server:
  port: ${http.port}
  address: ${listener.http-listener-configuration.host}
main:
  listener:
    path: /  # Listener path of flow main
request:
  http-request-configuration:
    host: www.predic8.com
    port: 8080
    path: shop/ShopService
cxf:
  proxy-service:
    # Upstream ShopService WSDL served on ?wsdl with its address rewritten (D-059)
    wsdl-location: http://www.predic8.com:8080/shop/ShopService?wsdl
    namespace: http://predic8.com/wsdl/shop/1/
    service: ShopService
    port: ShopServicePTPort
spring:
  application:
    name: proxying-a-soap-api-java
  mvc:
    throw-exception-if-no-handler-found: true  # An unmatched path raises NoHandlerFoundException (D-109)
    formcontent:
      filter:
        enabled: false  # Raw request bodies reach the controller unparsed (D-059, D-109)
  web:
    resources:
      add-mappings: false  # No static resource mapping (D-109)
  servlet:
    multipart:
      enabled: false  # Raw request bodies reach the controller unparsed (D-059, D-109)
  autoconfigure:
    # /error is an unmatched path like any other (D-109)
    exclude: org.springframework.boot.autoconfigure.web.servlet.error.ErrorMvcAutoConfiguration
